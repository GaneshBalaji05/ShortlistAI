<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ShortlistAI app icon</title>
  <desc id="desc">A red ShortlistAI badge with a white S and AI check mark.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="52" x2="438" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff4b52"/>
      <stop offset="0.55" stop-color="#ef2430"/>
      <stop offset="1" stop-color="#b9000b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#620008" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed background keeps the mark safe for Android adaptive/maskable icons. -->
  <rect width="512" height="512" rx="118" fill="#09090a"/>
  <circle cx="256" cy="256" r="190" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="189" fill="none" stroke="#ff7b81" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Primary ShortlistAI S mark -->
  <path d="M322 169c-14-19-37-29-69-29-50 0-85 25-85 64 0 35 24 52 71 62 35 8 47 14 47 31 0 16-15 26-39 26-29 0-50-11-66-32l-37 31c21 30 55 47 100 47 54 0 91-28 91-70 0-39-25-55-77-67-31-7-42-13-42-28 0-13 13-22 34-22 24 0 42 9 56 27l36-30Z" fill="#fff"/>

  <!-- AI/check accent -->
  <circle cx="374" cy="363" r="60" fill="#fff" stroke="#09090a" stroke-width="12"/>
  <path d="M345 363l19 19 38-43" fill="none" stroke="#111113" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
  <rect x="389" y="305" width="62" height="30" rx="15" fill="#09090a"/>
  <text x="420" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1" fill="#ff4149">AI</text>
</svg>
