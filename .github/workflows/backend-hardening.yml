name: Backend Hardening

on:
  push:
    branches:
      - backend-hardening-foundation
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    env:
      SQLITE_PATH: /tmp/shortlistai-backend-hardening.db
      SHORTLISTAI_EXPOSE_RESET_LINK: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile backend sources
        run: python -m compileall -q .

      - name: Backend preflight regression
        run: PYTHONPATH=. python tests/test_backend_preflight.py

      - name: Authentication recovery regression
        run: PYTHONPATH=. python tests/test_auth_recovery.py

      - name: Tenant isolation regression
        run: PYTHONPATH=. python tests/test_tenant_security.py

      - name: Account creation regression
        run: PYTHONPATH=. python tests/test_create_account.py

      - name: Boolean search regression
        run: PYTHONPATH=. python tests/test_boolean_search.py

      - name: Talent pool regression
        run: PYTHONPATH=. python tests/test_talent_pool.py

      - name: Final review regression
        run: PYTHONPATH=. python tests/test_final_review.py
