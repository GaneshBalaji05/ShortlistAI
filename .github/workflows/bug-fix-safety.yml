name: Bug Fix Safety

on:
  pull_request:
  push:
    branches: [main]

jobs:
  baseline-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Check JavaScript syntax
        run: |
          node --check static/login-controller.js
          node --check static/login-fetch-fix.js
          node --check static/login-view-icon.js
          node --check static/final-review.js
          node --check static/dashboard-v2.js
          node --check static/interviews-v1.js
          node --check static/sw.js

      - name: Import core runtime modules
        env:
          SQLITE_PATH: /tmp/shortlistai-ci.db
          SHORTLISTAI_EXPOSE_RESET_LINK: 'false'
        run: |
          python - <<'PY'
          import auth_runtime
          import boolean_search
          import final_review
          import tenant_security
          print('core runtime imports OK')
          PY

      - name: Run full regression suite
        env:
          SHORTLISTAI_EXPOSE_RESET_LINK: 'false'
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            db="/tmp/$(basename "$test" .py).db"
            rm -f "$db"
            echo "==> $test"
            SQLITE_PATH="$db" PYTHONPATH=. python "$test"
            rm -f "$db"
          done

      - name: Verify security-sensitive production defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          auth = Path('auth_runtime.py').read_text(encoding='utf-8')
          security = Path('tenant_security.py').read_text(encoding='utf-8')
          sw = Path('static/sw.js').read_text(encoding='utf-8')
          login = Path('static/login.html').read_text(encoding='utf-8')
          controller = Path('static/login-controller.js').read_text(encoding='utf-8')
          view = Path('static/login-view-icon.js').read_text(encoding='utf-8')
          manifest = json.loads(Path('static/manifest.webmanifest').read_text(encoding='utf-8'))

          assert 'httponly=True' in auth, 'session cookie must remain HttpOnly'
          assert 'SESSION_COOKIE' in security, 'tenant security must validate server session cookie'
          assert "url.pathname.startsWith('/api/')" in sw, 'service worker must not cache API data'
          assert "credentials: 'same-origin'" in sw, 'PWA navigation must preserve same-origin credentials'
          assert "const CACHE = 'shortlistai-v10'" in sw, 'auth hotfix must invalidate the old PWA cache'
          assert 'injectLoginViewIcon' not in sw, 'service worker must not mutate login HTML'
          assert '/static/login-controller.js?v=1' in login, 'login controller must load directly from the document'
          assert '/api/auth/login' not in login, 'legacy inline login handler must stay removed'
          assert "verifyCookieSession" in controller, 'login controller must verify the server cookie session'
          assert "resumeExistingSession" in controller, 'login page must recover an already authenticated session'
          assert "forgot-password" in controller and "reset-password" in controller, 'password recovery wiring must exist'
          assert "login-fetch-fix" not in view, 'view switcher must not inject authentication code'
          assert manifest.get('start_url') == '/app', 'installed app must launch through the protected workspace route'
          print('security/auth/PWA invariants OK')
          PY

      - name: Verify bug-fix standard exists
        run: |
          test -s BUG_FIX_STANDARD.md
          grep -q "Production flow verified" BUG_FIX_STANDARD.md
