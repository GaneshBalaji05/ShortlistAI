name: Candidate production safe smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/production_candidate_safe_smoke.py"
      - ".github/workflows/candidate-production-safe-smoke.yml"
  push:
    branches: [main]
    paths:
      - "tests/production_candidate_safe_smoke.py"
      - ".github/workflows/candidate-production-safe-smoke.yml"

jobs:
  production-safe-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Candidate v1 production path without mutating candidate data
        run: python tests/production_candidate_safe_smoke.py
