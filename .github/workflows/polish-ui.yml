name: Polish ATS user interface
on:
  push:
    branches:
      - main
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Improve recruiter UI
        run: python scripts/polish_ui.py
      - name: Commit polished UI
        run: |
          git config user.name "ShortlistAI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/index.html
          git diff --cached --quiet || git commit -m "Polish ShortlistAI user-friendly interface"
          git push
