name: View mode browser check

on:
  push:
    branches:
      - fix/true-mobile-desktop-view
  pull_request:
    branches: [main]

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Mobile View and Desktop View interactively
        env:
          SHORTLISTAI_URL: https://shortlistai-view-mode-preview.onrender.com
        run: node tests/view_mode_browser_check.mjs
