name: Login view icon checks

on:
  push:
    branches:
      - fix/login-view-icon
      - main
    paths:
      - "static/login.html"
      - "static/login-view-icon.js"
      - "static/sw.js"
      - ".github/workflows/login-view-icon-check.yml"
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check static/login-view-icon.js
          node --check static/sw.js
      - name: Login view icon regression
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('static/login.html','utf8');
          const icon=fs.readFileSync('static/login-view-icon.js','utf8');
          const sw=fs.readFileSync('static/sw.js','utf8');
          for(const marker of ['viewToggle','shortlistai-login-view','visualViewport','Desktop View','Mobile View']){
            if(!icon.includes(marker)) throw new Error(`missing icon marker: ${marker}`);
          }
          if(!/const\s+CACHE\s*=\s*['"]shortlistai-v\d+['"]/.test(sw)){
            throw new Error('service worker must use a versioned ShortlistAI cache');
          }
          if(!/\/static\/login-view-icon\.js\?v=\d+/.test(sw)){
            throw new Error('service worker must cache a versioned login view icon script');
          }
          if(!/\/static\/login-view-icon\.js\?v=\d+/.test(html)){
            throw new Error('login page must load the versioned view icon script directly');
          }
          if(sw.includes('injectLoginViewIcon') || sw.includes('html.replace')){
            throw new Error('service worker must not mutate login HTML');
          }
          console.log('Login view icon regression passed');
          NODE
