name: Add automatic profile capture
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-profile-capture.yml'
      - '.github/scripts/add_profile_capture.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ShortlistAI
        run: python .github/scripts/add_profile_capture.py
      - name: Commit changes
        run: |
          git config user.name "ShortlistAI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.py static/index.html
          git diff --cached --quiet || git commit -m "Add automatic profile detail capture"
          git push
