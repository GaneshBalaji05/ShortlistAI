name: Talent Boolean search checks

on:
  pull_request:
    paths:
      - "boolean_search.py"
      - "shortlistai_talent.py"
      - "tests/test_boolean_search.py"
      - ".github/workflows/talent-boolean-search-check.yml"
  push:
    branches: [main]
    paths:
      - "boolean_search.py"
      - "shortlistai_talent.py"
      - "tests/test_boolean_search.py"
      - ".github/workflows/talent-boolean-search-check.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tests/test_boolean_search.py

  production:
    if: github.event_name == 'push'
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Boolean search against stored production candidate evidence
        run: |
          python - <<'PY'
          import http.cookiejar
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          ROOT = "https://shortlistai-app.onrender.com"
          BASE = ROOT + "/api/candidates"
          EXCLUDED_PROFILE_KEYS = {"screening_status","interview_level","l1_status","l2_status","role_name","recruiter_name","source_history"}

          jar = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def expect_anonymous_401(path):
              request = urllib.request.Request(ROOT + path, headers={"Accept": "application/json"})
              try:
                  urllib.request.urlopen(request, timeout=30)
              except urllib.error.HTTPError as exc:
                  if exc.code != 401:
                      raise AssertionError(f"Anonymous {path} returned HTTP {exc.code}, expected 401")
                  return
              raise AssertionError(f"Anonymous {path} unexpectedly succeeded")

          def discover_demo_credentials():
              with urllib.request.urlopen(ROOT + "/", timeout=30) as response:
                  html = response.read().decode("utf-8", errors="ignore")
              match = re.search(r"([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})\s*·\s*([A-Za-z0-9]{8,})", html)
              if not match:
                  raise AssertionError("Public demo-login contract is missing from the production sign-in page")
              return match.group(1), match.group(2)

          def login():
              email, password = discover_demo_credentials()
              payload = json.dumps({"email": email, "password": password, "remember": False}).encode("utf-8")
              request = urllib.request.Request(
                  ROOT + "/api/auth/login",
                  data=payload,
                  method="POST",
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
              )
              with client.open(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"Login returned HTTP {response.status}")
                  cookie_header = "\n".join(response.headers.get_all("Set-Cookie") or [])
                  if "shortlistai_session=" not in cookie_header or "HttpOnly" not in cookie_header or "Secure" not in cookie_header:
                      raise AssertionError("Production login did not return the expected Secure HttpOnly session cookie")
                  data = json.load(response)
              if not data.get("ok") or not data.get("demo"):
                  raise AssertionError(f"QA demo login failed: {data}")
              if not any(cookie.name == "shortlistai_session" for cookie in jar):
                  raise AssertionError("Session cookie was not persisted by the verification client")

          def get_json(url):
              with client.open(url, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status} for {url}")
                  return json.load(response)

          def get_candidates(q=None):
              url = BASE
              if q is not None:
                  url += "?" + urllib.parse.urlencode({"q": q})
              return get_json(url)

          def evidence_text(row):
              profile = dict(row.get("profile_details") or {})
              for key in EXCLUDED_PROFILE_KEYS:
                  profile.pop(key, None)
              values = [
                  row.get("name"), row.get("email"), row.get("phone"), row.get("experience"),
                  row.get("skills"), row.get("resume_text"), row.get("resume_filename"),
                  row.get("notice_period"), row.get("current_ctc"), row.get("expected_ctc"), profile,
              ]
              return " ".join(json.dumps(v, ensure_ascii=False) if isinstance(v,(dict,list)) else str(v or "") for v in values).lower()

          def has_word(text, word):
              return re.search(r"(?<![a-z0-9])" + re.escape(word.lower()) + r"(?![a-z0-9])", text) is not None

          expect_anonymous_401("/api/candidates")
          login()
          session = get_json(ROOT + "/api/auth/session")
          if not session.get("ok") or not session.get("demo"):
              raise AssertionError(f"Authenticated session verification failed: {session}")

          for attempt in range(30):
              try:
                  all_rows = get_candidates()
                  java_rows = get_candidates("Java")
                  complex_rows = get_candidates('Java AND ("Spring Boot" OR Spring) NOT Python')

                  false_java = [row for row in java_rows if not has_word(evidence_text(row), "java")]
                  if false_java:
                      raise AssertionError(
                          "Java search returned rows without genuine candidate Java evidence: "
                          + ", ".join(str(r.get("name") or r.get("id")) for r in false_java[:10])
                      )

                  python_only = [
                      row for row in all_rows
                      if has_word(evidence_text(row), "python") and not has_word(evidence_text(row), "java")
                  ]
                  java_ids = {row.get("id") for row in java_rows}
                  leaked_python = [row for row in python_only if row.get("id") in java_ids]
                  if leaked_python:
                      raise AssertionError(
                          "Python-only profiles leaked into Java search: "
                          + ", ".join(str(r.get("name") or r.get("id")) for r in leaked_python[:10])
                      )

                  for row in complex_rows:
                      text = evidence_text(row)
                      if not has_word(text, "java"):
                          raise AssertionError(f"Complex query returned non-Java row: {row.get('name')}")
                      if not ("spring boot" in text or has_word(text, "spring")):
                          raise AssertionError(f"Complex query returned row without Spring evidence: {row.get('name')}")
                      if has_word(text, "python"):
                          raise AssertionError(f"Complex query returned Python row despite NOT Python: {row.get('name')}")

                  print(f"Production verification passed: auth protection confirmed; authenticated demo session established; {len(all_rows)} stored candidates; {len(java_rows)} genuine Java results; {len(complex_rows)} complex-query results; {len(python_only)} Python-only profiles checked.")
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code == 401:
                      login()
                  if attempt == 29:
                      raise
                  print(f"Production not ready yet ({attempt + 1}/30): HTTP {exc.code}")
                  time.sleep(10)
              except Exception as exc:
                  if attempt == 29:
                      raise
                  print(f"Production not ready yet ({attempt + 1}/30): {exc}")
                  time.sleep(10)
          PY
