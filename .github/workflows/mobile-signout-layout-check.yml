name: Mobile Sign out layout check

on:
  pull_request:
    branches: [main]
    paths:
      - 'static/theme-v2.css'
      - 'static/theme-v2.js'
      - 'static/index.html'
      - 'static/final-review.js'
      - 'tests/mobile_signout_layout_check.mjs'
      - '.github/workflows/mobile-signout-layout-check.yml'

jobs:
  responsive-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Sign out layout at required breakpoints
        shell: bash
        run: |
          set +e
          node tests/mobile_signout_layout_check.mjs 2>&1 | tee mobile-signout-layout.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload responsive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-signout-layout-diagnostics
          path: mobile-signout-layout.log
